<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>口語測驗模擬錄音系統</title>
    <style>
        :root { --bg: #FFFBEB; --primary: #FBBF24; --secondary: #3B82F6; --danger: #EF4444; --text: #1F2937; }
        body { font-family: 'Arial Black', 'Microsoft JhengHei', sans-serif; background-color: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { width: 95%; max-width: 500px; height: 92vh; display: flex; flex-direction: column; padding: 25px; box-sizing: border-box; background: white; border-radius: 40px; border: 6px solid var(--text); box-shadow: 0 15px 0px #D1D5DB; }
        h1 { font-size: 26px; color: var(--text); margin: 0 0 15px; text-align: center; background: var(--primary); padding: 8px; border-radius: 15px; border: 3px solid var(--text); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .mode-btn { background: #F3F4F6; border: 3px solid var(--text); border-radius: 20px; padding: 18px 5px; font-size: 22px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 var(--text); transition: 0.1s; display: flex; flex-direction: column; align-items: center; }
        .mode-btn.active { background: var(--secondary); color: white; transform: translateY(4px); box-shadow: 0 2px 0 var(--text); }
        .mode-btn span { font-size: 13px; display: block; font-weight: normal; margin-top: 3px; }
        .timer-box { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        #clock { font-size: 110px; font-weight: 900; color: var(--text); font-family: 'Arial', sans-serif; }
        .action-area { padding-bottom: 20px; display: flex; flex-direction: column; align-items: center; }
        #recordBtn { width: 170px; height: 170px; border-radius: 50%; border: 8px solid var(--text); background: var(--danger); color: white; font-size: 30px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 0 #991B1B; transition: 0.2s; }
        #recordBtn:disabled { background: #D1D5DB; box-shadow: 0 6px 0 #9CA3AF; opacity: 0.6; cursor: not-allowed; }
        #recordBtn.recording { animation: pulse 1s infinite; background: #FF0000; box-shadow: none; border-color: #fff; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        #status { margin-top: 15px; font-size: 18px; color: var(--secondary); font-weight: bold; height: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>測驗模擬錄音 🎤</h1>
        <div class="grid">
            <button class="mode-btn" onclick="prep(30, this, '情境對話')">情境對話<span>30s</span></button>
            <button class="mode-btn" onclick="prep(60, this, '看圖講話')">看圖講話<span>60s</span></button>
            <button class="mode-btn" onclick="prep(90, this, '文章朗讀')">文章朗讀<span>90s</span></button>
            <button class="mode-btn" onclick="prep(120, this, '口語表達')">口語表達<span>120s</span></button>
        </div>
        <div class="timer-box"><div id="clock">00:00</div></div>
        <div class="action-area">
            <button id="recordBtn" onclick="run()" disabled>開始錄音</button>
            <div id="status">請選取測驗項目</div>
        </div>
    </div>

    <script>
        let audioCtx, recorder, chunks = [], limit = 0, timer, cat = "";

        // 核心：直接生成純淨的 TNG 物理波形（不含任何錄音成分）
        function playPureTng(count) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 標準測驗音頻率
                    gain.gain.setValueAtTime(0, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.8, audioCtx.currentTime + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                }, i * 500); // 雙聲間隔 0.5 秒
            }
        }

        function prep(s, btn, name) {
            // 喚醒音訊環境
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            limit = s; cat = name;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('recordBtn').disabled = false;
            document.getElementById('status').innerText = "目標：" + name;
            draw(s);
        }

        function draw(s) {
            let m = Math.floor(s/60), sec = s%60;
            document.getElementById('clock').innerText = `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        async function run() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(stream);
                chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const now = new Date();
                    // 下載命名自動分類
                    a.download = `[${cat}]_${now.getHours()}${now.getMinutes()}.wav`;
                    a.href = url; a.click();
                };

                recorder.start();
                let left = limit, passed = 0;
                const btn = document.getElementById('recordBtn');
                btn.disabled = true; btn.classList.add('recording'); btn.innerText = "正在錄音";
                document.getElementById('status').innerText = "🔴 請開始作答...";

                timer = setInterval(() => {
                    passed++; left--; draw(left);
                    
                    // 根據需求播放純淨 TNG
                    if (limit === 30 && passed === 20) playPureTng(1);
                    if (limit === 60 && passed === 50) playPureTng(1);
                    if (limit === 90 && passed === 70) playPureTng(2);
                    if (limit === 120 && passed === 100) playPureTng(2);

                    if (left <= 0) {
                        clearInterval(timer); recorder.stop();
                        btn.disabled = false; btn.classList.remove('recording');
                        btn.innerText = "完成";
                        document.getElementById('status').innerText = "✅ 錄音已儲存";
                    }
                }, 1000);
            } catch (e) { alert("請授權麥克風權限！"); }
        }
    </script>
</body>
</html>
