<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口語測驗模擬錄音系統</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --danger: #e74c3c; --success: #27ae60; }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .app-container { background: white; width: 90%; max-width: 500px; padding: 40px 30px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); text-align: center; }
        h1 { color: var(--primary); font-size: 24px; margin-bottom: 5px; }
        .sub-title { color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .btn-item { padding: 20px 10px; font-size: 16px; font-weight: bold; border: 2px solid #ecf0f1; background: #fff; color: var(--primary); border-radius: 20px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .btn-item span { font-size: 12px; color: #95a5a6; font-weight: normal; }
        .btn-item:hover { border-color: var(--accent); color: var(--accent); }
        .btn-item.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 8px 15px rgba(52, 152, 219, 0.3); }
        .btn-item.active span { color: rgba(255,255,255,0.8); }
        .timer-display { font-size: 85px; font-weight: 900; font-family: 'Courier New', monospace; color: var(--primary); margin: 25px 0; letter-spacing: -2px; }
        #recordBtn { width: 140px; height: 140px; border-radius: 50%; border: none; background: var(--danger); color: white; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(231, 76, 60, 0.3); }
        #recordBtn:disabled { background: #ecf0f1; color: #bdc3c7; box-shadow: none; cursor: not-allowed; }
        .recording-pulse { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(231, 76, 60, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); } }
        #status-msg { margin-top: 20px; font-size: 16px; color: var(--accent); font-weight: 500; min-height: 24px; }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>口語測驗模擬錄音</h1>
        <p class="sub-title">實作練習專用工具</p>
        
        <div class="grid-menu">
            <button class="btn-item" onclick="prep(30, this, '情境對話')">情境對話 <span>30s</span></button>
            <button class="btn-item" onclick="prep(60, this, '看圖講話')">看圖講話 <span>60s</span></button>
            <button class="btn-item" onclick="prep(90, this, '文章朗讀')">文章朗讀 <span>90s</span></button>
            <button class="btn-item" onclick="prep(120, this, '口語表達')">口語表達 <span>120s</span></button>
        </div>

        <div class="timer-display" id="clock">00:00</div>

        <button id="recordBtn" onclick="start()" disabled>請先選擇<br>測驗項目</button>
        <div id="status-msg">請選擇上方項目以啟用系統</div>
    </div>

    <script>
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        let recorder, chunks = [], limit = 0, timer, cat = "";

        function prep(s, el, name) {
            if (ctx.state === 'suspended') ctx.resume();
            limit = s; cat = name;
            document.querySelectorAll('.btn-item').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('recordBtn').disabled = false;
            document.getElementById('recordBtn').innerHTML = "開始錄音";
            document.getElementById('status-msg').innerText = "系統已就緒，可開始錄音";
            updateClock(s);
        }

        function updateClock(s) {
            let m = Math.floor(s/60), sec = s%60;
            document.getElementById('clock').innerText = `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        function playTng(n) {
            for(let i=0; i<n; i++) {
                setTimeout(() => {
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    o.connect(g); g.connect(ctx.destination);
                    o.type = 'sine'; o.frequency.value = 950;
                    g.gain.setValueAtTime(0.5, ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    o.start(); o.stop(ctx.currentTime + 0.4);
                }, i * 450);
            }
        }

        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(stream);
                chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const now = new Date();
                    const timeStr = `${now.getMonth()+1}${now.getDate()}_${now.getHours()}${now.getMinutes()}`;
                    a.href = url;
                    // 自動命名格式：項目名稱_時間.wav
                    a.download = `${cat}_${timeStr}.wav`;
                    a.click();
                };

                recorder.start();
                let left = limit, passed = 0;
                const btn = document.getElementById('recordBtn');
                btn.disabled = true; btn.classList.add('recording-pulse');
                btn.innerText = "錄音中...";
                document.getElementById('status-msg').innerText = "🔴 正在錄製：" + cat;

                timer = setInterval(() => {
                    passed++; left--; updateClock(left);
                    if (limit === 30 && passed === 20) playTng(1);
                    if (limit === 60 && passed === 50) playTng(1);
                    if (limit === 90 && passed === 70) playTng(2);
                    if (limit === 120 && passed === 100) playTng(2);

                    if (left <= 0) {
                        clearInterval(timer); recorder.stop();
                        btn.disabled = false; btn.classList.remove('recording-pulse');
                        btn.innerText = "錄音完成";
                        document.getElementById('status-msg').innerText = "✅ 檔案已存入下載資料夾";
                    }
                }, 1000);
            } catch (e) { alert("請授權麥克風權限！"); }
        }
    </script>
</body>
</html>
