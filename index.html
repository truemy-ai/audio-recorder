    <style>

        .mode-btn span { font-size: 13px; display: block; font-weight: normal; margin-top: 3px; }
        .timer-box { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        #clock { font-size: 110px; font-weight: 900; color: var(--text); font-family: 'Arial', sans-serif; }
        .action-area { padding-bottom: 20px; display: flex; flex-direction: column; align-items: center; }
        #recordBtn { width: 180px; height: 180px; border-radius: 50%; border: 6px solid var(--text); background: var(--danger); color: white; font-size: 30px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 0 #991B1B; transition: 0.2s; }
        #recordBtn:disabled { background: #D1D5DB; box-shadow: 0 6px 0 #9CA3AF; opacity: 0.6; cursor: not-allowed; }
        #recordBtn.recording { animation: pulse 1s infinite; background: #FF0000; border-color: #fff; box-shadow: none; transform: scale(1.05); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        #status { margin-top: 15px; font-size: 18px; color: var(--secondary); font-weight: bold; height: 25px; }
    </style>
