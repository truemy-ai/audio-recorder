<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口語測驗模擬錄音系統</title>
    <style>
        :root { --yellow: #FFD93D; --orange: #FF8400; --blue: #4F9DA6; --red: #FF4B91; }
        body { font-family: 'Arial Rounded MT Bold', 'Microsoft JhengHei', sans-serif; background-color: #FFF9DE; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .app-card { background: white; width: 95%; max-width: 500px; padding: 30px; border-radius: 40px; box-shadow: 0 15px 0px #F1C93B; border: 4px solid #444; text-align: center; }
        h1 { color: #444; font-size: 32px; margin-bottom: 25px; text-shadow: 2px 2px 0px #eee; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .mode-btn { padding: 25px 10px; font-size: 22px; font-weight: 900; border: 3px solid #444; background: var(--yellow); color: #444; border-radius: 25px; cursor: pointer; transition: 0.1s; box-shadow: 0 6px 0px #444; }
        .mode-btn:active { transform: translateY(4px); box-shadow: 0 2px 0px #444; }
        .mode-btn.active { background: var(--orange); color: white; border-color: #444; }
        .mode-btn span { font-size: 14px; display: block; margin-top: 5px; opacity: 0.8; }
        .timer-display { font-size: 100px; font-weight: 900; color: #444; margin: 20px 0; font-family: 'Comic Sans MS', sans-serif; }
        #recordBtn { width: 180px; height: 180px; border-radius: 50%; border: 6px solid #444; background: var(--red); color: white; font-size: 28px; font-weight: 900; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 0px #9B3061; }
        #recordBtn:disabled { background: #ccc; box-shadow: 0 6px 0px #999; cursor: not-allowed; opacity: 0.6; }
        .recording-pulse { animation: blink 1s infinite; border-color: white !important; }
        @keyframes blink { 0% { background: var(--red); } 50% { background: #ff7eb3; } 100% { background: var(--red); } }
        #status-msg { margin-top: 25px; font-size: 20px; font-weight: bold; color: var(--blue); height: 30px; }
    </style>
</head>
<body>
    <div class="app-card">
        <h1>測驗錄音練習 🎤</h1>
        <div class="grid-menu">
            <button class="mode-btn" onclick="prep(30, this, '情境對話')">情境對話<span>30s</span></button>
            <button class="mode-btn" onclick="prep(60, this, '看圖講話')">看圖講話<span>60s</span></button>
            <button class="mode-btn" onclick="prep(90, this, '文章朗讀')">文章朗讀<span>90s</span></button>
            <button class="mode-btn" onclick="prep(120, this, '口語表達')">口語表達<span>120s</span></button>
        </div>
        <div class="timer-display" id="clock">00:00</div>
        <button id="recordBtn" onclick="start()" disabled>選一個項目</button>
        <div id="status-msg">請點擊上方按鈕開始</div>
    </div>

    <script>
        let audioCtx;
        let recorder, chunks = [], limit = 0, timer, cat = "";

        // 初始化音訊並測試播放
        function prep(s, el, name) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // 靜音喚醒技術：點擊時先發出一個極短的無聲訊號
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0.001; 
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);

            limit = s; cat = name;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            const rb = document.getElementById('recordBtn');
            rb.disabled = false; rb.innerText = "按我錄音";
            document.getElementById('status-msg').innerText = "準備好了！";
            updateClock(s);
        }

        function updateClock(s) {
            let m = Math.floor(s/60), sec = s%60;
            document.getElementById('clock').innerText = `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        function playTng(n) {
            for(let i=0; i<n; i++) {
                setTimeout(() => {
                    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'sine'; o.frequency.value = 1000;
                    g.gain.setValueAtTime(0.6, audioCtx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    o.start(); o.stop(audioCtx.currentTime + 0.4);
                }, i * 400);
            }
        }

        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(stream);
                chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const now = new Date();
                    a.href = url;
                    a.download = `[${cat}]_${now.getHours()}${now.getMinutes()}${now.getSeconds()}.wav`;
                    a.click();
                };

                recorder.start();
                let left = limit, passed = 0;
                const btn = document.getElementById('recordBtn');
                btn.disabled = true; btn.classList.add('recording-pulse');
                btn.innerText = "正在錄音";
                document.getElementById('status-msg').innerText = "🔴 錄音中，加油！";

                timer = setInterval(() => {
                    passed++; left--; updateClock(left);
                    
                    // 根據需求精準提醒
                    if (limit === 30 && passed === 20) playTng(1);
                    if (limit === 60 && passed === 50) playTng(1);
                    if (limit === 90 && passed === 70) playTng(2);
                    if (limit === 120 && passed === 100) playTng(2);

                    if (left <= 0) {
                        clearInterval(timer); recorder.stop();
                        btn.disabled = false; btn.classList.remove('recording-pulse');
                        btn.innerText = "成功！";
                        document.getElementById('status-msg').innerText = "✅ 錄音已存入手機/電腦";
                    }
                }, 1000);
            } catch (e) { alert("請記得開啟麥克風權限喔！"); }
        }
    </script>
</body>
</html>
