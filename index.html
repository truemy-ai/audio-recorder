<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>口語測驗錄音</title>
    <style>
        :root { --bg: #F0FFF0; --primary: #FFB100; --secondary: #2192FF; --danger: #EF4444; --text: #1F2937; }
        body { 
            font-family: 'Microsoft JhengHei', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            display: flex; 
            align-items: center; /* 居中對齊，減少上下空白 */
            justify-content: center; 
            height: 100vh; 
            overflow: hidden;
        }
        .container { 
            width: 92%; 
            max-width: 400px; 
            height: 90vh; /* 增加高度比例，讓框框填滿螢幕 */
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            box-sizing: border-box; 
            background: white; 
            border-radius: 30px; 
            border: 5px solid var(--text); 
            box-shadow: 0 10px 0px #D1D5DB;
        }
        .header-box { 
            background: var(--primary); 
            padding: 12px 0; 
            border-radius: 15px; 
            border: 3px solid var(--text);
            margin-bottom: 15px;
        }
        h1 { font-size: 20px; color: var(--text); margin: 0; text-align: center; white-space: nowrap; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .mode-btn { 
            background: #F3F4F6; border: 3px solid var(--text); border-radius: 15px; 
            padding: 15px 0; font-size: 19px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 5px 0 var(--text); transition: 0.1s; 
        }
        .mode-btn.active { background: var(--secondary); color: white; transform: translateY(2px); box-shadow: 0 2px 0 var(--text); }
        .mode-btn span { font-size: 13px; display: block; font-weight: normal; margin-top: 2px; }
        .timer-box { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        #clock { font-size: 100px; font-weight: 900; color: var(--text); font-family: 'Arial', sans-serif; letter-spacing: -3px; }
        #recordBtn { 
            width: 150px; height: 150px; border-radius: 50%; border: 6px solid var(--text); 
            background: var(--danger); color: white; font-size: 28px; font-weight: 900; 
            cursor: pointer; box-shadow: 0 8px 0 #991B1B; transition: 0.2s; 
        }
        #recordBtn:disabled { background: #D1D5DB; box-shadow: 0 5px 0 #9CA3AF; opacity: 0.6; }
        #recordBtn.recording { animation: pulse 1s infinite; background: #FF0000; box-shadow: none; border-color: #fff; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        #status { margin-top: 15px; font-size: 16px; color: var(--secondary); font-weight: bold; text-align: center; height: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box"><h1>口語測驗模擬錄音 🎤</h1></div>
        <div class="grid">
            <button class="mode-btn" onclick="prep(30, this, '情境對話')">情境對話<span>30s</span></button>
            <button class="mode-btn" onclick="prep(60, this, '看圖講話')">看圖講話<span>60s</span></button>
            <button class="mode-btn" onclick="prep(90, this, '文章朗讀')">文章朗讀<span>90s</span></button>
            <button class="mode-btn" onclick="prep(120, this, '口語表達')">口語表達<span>120s</span></button>
        </div>
        <div class="timer-box"><div id="clock">00:00</div></div>
        <div style="display: flex; flex-direction: column; align-items: center; padding-bottom: 10px;">
            <button id="recordBtn" onclick="run()" disabled>START</button>
            <div id="status">請選取測驗項目</div>
        </div>
    </div>

    <script>
        const FORM_URL = "https://forms.gle/xzAgzSnBBUC7jBFG6"; // 您的連結已在此處
        let audioCtx, recorder, chunks = [], limit = 0, timer, cat = "";
        
        function makeBeep(times) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            for (let i = 0; i < times; i++) {
                const start = now + (i * 0.5);
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, start);
                gain.gain.setValueAtTime(0, start);
                gain.gain.linearRampToValueAtTime(0.5, start + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, start + 0.4);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(start); osc.stop(start + 0.5);
            }
        }

        function prep(s, btn, name) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            limit = s; cat = name;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('recordBtn').disabled = false;
            document.getElementById('status').innerText = "目標：" + name;
            draw(s);
        }

        function draw(s) {
            let m = Math.floor(s/60), sec = s%60;
            document.getElementById('clock').innerText = `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        async function run() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(stream);
                chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const rand = Math.floor(Math.random() * 9000) + 1000;
                    a.download = `[${cat}]_${rand}.wav`;
                    a.href = url; a.click();
                    setTimeout(() => {
                        if(confirm("錄音已下載！\n按「確定」前往表單上傳該檔案。")) {
                            window.location.href = FORM_URL;
                        }
                    }, 1000);
                };
                recorder.start();
                let left = limit;
                const btn = document.getElementById('recordBtn');
                btn.disabled = true; btn.classList.add('recording');
                document.getElementById('status').innerText = "🔴 正在錄音...";
                timer = setInterval(() => {
                    left--; draw(left);
                    if ((limit === 30 || limit === 60) && left === 10) makeBeep(1);
                    if ((limit === 90 || limit === 120) && left === 20) makeBeep(2);
                    if (left <= 0) {
                        clearInterval(timer); recorder.stop();
                        btn.disabled = false; btn.classList.remove('recording');
                        btn.innerText = "完成";
                    }
                }, 1000);
            } catch (e) { alert("請授權麥克風權限！"); }
        }
    </script>
</body>
</html>
