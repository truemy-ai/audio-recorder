<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>口語測驗模擬系統</title>
    <style>
        :root { --bg: #FFFAE6; --card: #FFFFFF; --primary: #FFB100; --secondary: #2192FF; --danger: #FF4B91; --text: #333; }
        body { font-family: 'Arial Black', 'Microsoft JhengHei', sans-serif; background-color: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { width: 100%; max-width: 600px; height: 100%; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        
        h1 { font-size: clamp(24px, 6vw, 36px); color: var(--text); margin: 10px 0; text-align: center; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .mode-btn { background: var(--card); border: 4px solid var(--text); border-radius: 20px; padding: 20px 10px; font-size: clamp(18px, 4vw, 24px); font-weight: 900; cursor: pointer; box-shadow: 0 8px 0 var(--text); transition: 0.1s; }
        .mode-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--text); }
        .mode-btn.active { background: var(--primary); color: white; transform: translateY(4px); box-shadow: 0 4px 0 var(--text); }
        .mode-btn span { font-size: 14px; display: block; font-weight: normal; margin-top: 5px; color: #666; }
        .mode-btn.active span { color: white; }

        .timer-box { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        #clock { font-size: clamp(80px, 20vw, 150px); font-weight: 900; color: var(--text); font-family: 'Courier New', monospace; letter-spacing: -5px; }
        
        .action-area { padding-bottom: 30px; display: flex; flex-direction: column; align-items: center; }
        #recordBtn { width: clamp(150px, 40vw, 220px); height: clamp(150px, 40vw, 220px); border-radius: 50%; border: 8px solid var(--text); background: var(--danger); color: white; font-size: clamp(24px, 5vw, 32px); font-weight: 900; cursor: pointer; box-shadow: 0 12px 0 #9B3061; transition: 0.2s; }
        #recordBtn:disabled { background: #bbb; box-shadow: 0 8px 0 #777; opacity: 0.7; cursor: not-allowed; }
        #recordBtn.recording { animation: pulse 1s infinite; background: #ff0000; border-color: #fff; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        #status { margin-top: 15px; font-size: 20px; color: var(--secondary); font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>口語測驗模擬錄音 🎤</h1>
        
        <div class="grid">
            <button class="mode-btn" onclick="ready(30, this, '情境對話')">情境對話<span>30s</span></button>
            <button class="mode-btn" onclick="ready(60, this, '看圖講話')">看圖講話<span>60s</span></button>
            <button class="mode-btn" onclick="ready(90, this, '文章朗讀')">文章朗讀<span>90s</span></button>
            <button class="mode-btn" onclick="ready(120, this, '口語表達')">口語表達<span>120s</span></button>
        </div>

        <div class="timer-box">
            <div id="clock">00:00</div>
        </div>

        <div class="action-area">
            <button id="recordBtn" onclick="run()" disabled>請先選擇<br>測驗項目</button>
            <div id="status">準備就緒後點擊錄音</div>
        </div>
    </div>

    <script>
        let audioCtx, recorder, chunks = [], limit = 0, timer, cat = "";

        // 啟動音訊與設定項目
        function ready(s, btn, name) {
            // 強制喚醒音訊環境
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // 點擊即測音 (一聲極短的叮)
            testSound();

            limit = s; cat = name;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const r = document.getElementById('recordBtn');
            r.disabled = false;
            r.innerHTML = "START";
            document.getElementById('status').innerText = "目標：" + name;
            draw(s);
        }

        function draw(s) {
            let m = Math.floor(s/60), sec = s%60;
            document.getElementById('clock').innerText = `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        function testSound() {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value = 1200; g.gain.value = 0.01;
            o.start(); o.stop(audioCtx.currentTime + 0.1);
        }

        function tng(times) {
            for(let i=0; i<times; i++) {
                setTimeout(() => {
                    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.setValueAtTime(1000, audioCtx.currentTime); // 清脆的高音
                    g.gain.setValueAtTime(0.8, audioCtx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    o.start(); o.stop(audioCtx.currentTime + 0.5);
                }, i * 400);
            }
        }

        async function run() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(stream);
                chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const now = new Date();
                    a.href = url;
                    a.download = `[${cat}]_${now.getHours()}${now.getMinutes()}${now.getSeconds()}.wav`;
                    a.click();
                };

                recorder.start();
                let left = limit, passed = 0;
                const btn = document.getElementById('recordBtn');
                btn.disabled = true; btn.classList.add('recording'); btn.innerText = "REC";
                document.getElementById('status').innerText = "🔴 正在錄音...";

                timer = setInterval(() => {
                    passed++; left--; draw(left);
                    
                    // 精準觸發 TNG 邏輯
                    if (limit === 30 && passed === 20) tng(1);
                    if (limit === 60 && passed === 50) tng(1);
                    if (limit === 90 && passed === 70) tng(2);
                    if (limit === 120 && passed === 100) tng(2);

                    if (left <= 0) {
                        clearInterval(timer); recorder.stop();
                        btn.disabled = false; btn.classList.remove('recording');
                        btn.innerText = "完成";
                        document.getElementById('status').innerText = "✅ 檔案已自動下載";
                    }
                }, 1000);
            } catch (e) { alert("請務必允許麥克風權限！"); }
        }
    </script>
</body>
</html>
