<!DOCTYPE html><!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育部口語測驗錄音工具</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; text-align: center; padding: 20px; background: #f0f2f5; }
        .btn-group { margin: 20px 0; display: flex; justify-content: center; flex-wrap: wrap; }
        button { padding: 12px 18px; margin: 8px; font-size: 16px; cursor: pointer; border-radius: 8px; border: 1px solid #007bff; background: white; color: #007bff; font-weight: bold; }
        .time-btn.active { background: #007bff; color: white; }
        #recordBtn { background: #e74c3c; color: white; width: 130px; height: 130px; border-radius: 50%; border: none; font-weight: bold; font-size: 20px; margin-top: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #recordBtn:disabled { background: #bdc3c7; cursor: not-allowed; box-shadow: none; }
        #timer { font-size: 72px; color: #2c3e50; margin: 20px; font-weight: bold; font-family: monospace; }
        #status { color: #7f8c8d; font-size: 18px; margin-top: 15px; }
    </style>
</head>
<body>
    <h2 style="color: #2c3e50;">教育部口語測驗錄音模擬</h2>
    <div class="btn-group">
        <button class="time-btn" onclick="setTime(30, this)">情境對話(30s)</button>
        <button class="time-btn" onclick="setTime(60, this)">看圖講話(1m)</button>
        <button class="time-btn" onclick="setTime(90, this)">文章朗讀(1.5m)</button>
        <button class="time-btn" onclick="setTime(120, this)">口語表達(2m)</button>
    </div>
    <div id="timer">00:00</div>
    <button id="recordBtn" onclick="startRecording()" disabled>點擊<br>開始錄音</button>
    <p id="status">請先選擇測驗項目</p>

    <script>
        // 這段程式碼已經內建了「一聲」和「兩聲」的電子合成音，不需要外連任何 mp3
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playDing(times) {
            let delay = 0;
            for(let i=0; i<times; i++) {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 高頻 A5 音，接近 TNG 聲
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                }, delay);
                delay += 500; // 兩聲之間的間隔
            }
        }

        let mediaRecorder, audioChunks = [], limitTime = 0, timerInterval;

        function setTime(s, b) {
            limitTime = s;
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            b.classList.add('active');
            document.getElementById('recordBtn').disabled = false;
            updateDisplay(s);
        }

        function updateDisplay(s) {
            let m = Math.floor(s/60), sec = s%60;
            document.getElementById('timer').innerText = `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        async function startRecording() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/wav' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `測驗錄音_${new Date().getTime()}.wav`;
                    link.click();
                };

                mediaRecorder.start();
                let timeLeft = limitTime, elapsed = 0;
                document.getElementById('recordBtn').disabled = true;
                document.getElementById('status').innerText = "🔴 正在錄音...";

                timerInterval = setInterval(() => {
                    elapsed++; timeLeft--; updateDisplay(timeLeft);
                    
                    // 根據需求精準觸發聲音
                    if (limitTime === 30 && elapsed === 20) playDing(1);
                    if (limitTime === 60 && elapsed === 50) playDing(1);
                    if (limitTime === 90 && elapsed === 70) playDing(2);
                    if (limitTime === 120 && elapsed === 100) playDing(2);

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        mediaRecorder.stop();
                        document.getElementById('recordBtn').disabled = false;
                        document.getElementById('status').innerText = "錄音結束，檔案已下載。";
                    }
                }, 1000);
            } catch (err) {
                alert("請允許麥克風權限以進行錄音！");
            }
        }
    </script>
</body>
</html>
