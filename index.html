<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>口語測驗實作練習模擬錄音</title>
    <style>
        :root { --bg: #FFFBEB; --primary: #FBBF24; --secondary: #3B82F6; --danger: #EF4444; --text: #1F2937; }
        body { font-family: 'Arial Black', 'Microsoft JhengHei', sans-serif; background-color: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { width: 100%; max-width: 500px; height: 95%; display: flex; flex-direction: column; padding: 25px; box-sizing: border-box; background: white; border-radius: 40px; border: 6px solid var(--text); box-shadow: 0 20px 0px #D1D5DB; }
        h1 { font-size: 26px; color: var(--text); margin: 0 0 20px; text-align: center; border-bottom: 5px solid var(--primary); padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .mode-btn { background: #F3F4F6; border: 3px solid var(--text); border-radius: 20px; padding: 20px 5px; font-size: 22px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 var(--text); transition: 0.1s; display: flex; flex-direction: column; align-items: center; }
        .mode-btn.active { background: var(--primary); color: white; transform: translateY(4px); box-shadow: 0 2px 0 var(--text); }
        .mode-btn span { font-size: 14px; font-weight: normal; margin-top: 5px; }
        .timer-box { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        #clock { font-size: 120px; font-weight: 900; color: var(--text); font-family: 'Arial', sans-serif; letter-spacing: -2px; }
        .action-area { padding-bottom: 20px; display: flex; flex-direction: column; align-items: center; }
        #recordBtn { width: 180px; height: 180px; border-radius: 50%; border: 8px solid var(--text); background: var(--danger); color: white; font-size: 32px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 0 #991B1B; transition: 0.2s; }
        #recordBtn:disabled { background: #D1D5DB; box-shadow: 0 6px 0 #9CA3AF; opacity: 0.6; cursor: not-allowed; }
        #recordBtn.recording { animation: pulse 1s infinite; background: #FF0000; border-color: #fff; box-shadow: none; transform: scale(1.05); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        #status { margin-top: 15px; font-size: 18px; color: var(--secondary); font-weight: bold; height: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>測驗模擬錄音 🎤</h1>
        <div class="grid">
            <button class="mode-btn" onclick="prep(30, this, '情境對話')">情境對話<span>30s</span></button>
            <button class="mode-btn" onclick="prep(60, this, '看圖講話')">看圖講話<span>60s</span></button>
            <button class="mode-btn" onclick="prep(90, this, '文章朗讀')">文章朗讀<span>90s</span></button>
            <button class="mode-btn" onclick="prep(120, this, '口語表達')">口語表達<span>120s</span></button>
        </div>
        <div class="timer-box"><div id="clock">00:00</div></div>
        <div class="action-area">
            <button id="recordBtn" onclick="run()" disabled>START</button>
            <div id="status">請先選取測驗項目</div>
        </div>
    </div>
