    <style>
        :root { --bg: #F0FFF0; --primary: #FFB100; --secondary: #2192FF; --danger: #EF4444; --text: #1F2937; }
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: var(--bg); margin: 0; display: flex; align-items: flex-start; justify-content: center; height: 100vh; overflow: hidden; }
        .container { width: 95%; max-width: 400px; margin-top: 10px; display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; background: white; border-radius: 20px; border: 5px solid var(--text); box-shadow: 0 8px 0px #D1D5DB; }
        .header-box { background: var(--primary); padding: 8px 0; border-radius: 12px; border: 3px solid var(--text); margin-bottom: 10px; }
        h1 { font-size: 19px; color: var(--text); margin: 0; text-align: center; white-space: nowrap; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .mode-btn { background: #F3F4F6; border: 3px solid var(--text); border-radius: 12px; padding: 10px 0; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 var(--text); transition: 0.1s; }
        .mode-btn.active { background: var(--secondary); color: white; transform: translateY(2px); box-shadow: 0 2px 0 var(--text); }
        .mode-btn span { font-size: 11px; display: block; font-weight: normal; }
        .timer-box { flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 80px; }
        #clock { font-size: 90px; font-weight: 900; color: var(--text); font-family: 'Arial', sans-serif; }
        .action-area { display: flex; flex-direction: column; align-items: center; padding-bottom: 5px; }
        #recordBtn { width: 120px; height: 120px; border-radius: 50%; border: 6px solid var(--text); background: var(--danger); color: white; font-size: 22px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 0 #991B1B; transition: 0.1s; }
        #recordBtn:disabled { background: #D1D5DB; box-shadow: 0 4px 0 #9CA3AF; opacity: 0.6; }
        #recordBtn.recording { animation: pulse 1s infinite; background: #FF0000; box-shadow: none; border-color: #fff; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        #status { margin-top: 5px; font-size: 15px; color: var(--secondary); font-weight: bold; text-align: center; height: 20px; }
    </style>
</head>
